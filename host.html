<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MALDA JS Backend Host</title>
</head>
<body>
    <h1>MALDA JS backend demo host</h1>
    <p>Choose which compiled script to run by uncommenting one line below.</p>

    <div id="app"></div>

    <!-- 1) Load MALDA runtime -->
    <!-- For three.* demos, load a compatible browser bundle before malda-js-runtime.js. -->
    <script src="./Examples/Web/wwwroot/vendor/three.min.js"></script>
    <script src="./Examples/Web/wwwroot/malda-js-runtime.js"></script>

    <!-- 2) Load one compiled MALDA app -->
    <script src="./program.js"></script>
    <!-- <script src="./counter.js"></script> -->
    <!-- <script src="./game_bounce.js"></script> -->
    <!-- <script src="./maldanoid.js"></script> -->
    <!-- <script src="./three_cube.js"></script> -->
    <!-- <script src="./hello_template.generated.js"></script> -->

    <!-- 3) Bootstrap the compiled app -->
    <script>
        if (window.MaldaApp && typeof window.MaldaApp.main === "function") {
            window.MaldaApp.main();
        }

        if (window.MaldaApp && typeof window.MaldaApp.bootstrap === "function") {
            window.MaldaApp.bootstrap("#app");
        }
    </script>
</body>
</html>
