<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess smoke test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 16px;
      background: #0f172a;
      color: #e2e8f0;
    }

    #app canvas {
      width: min(960px, 100%);
      height: auto;
      touch-action: none;
      border: 1px solid #334155;
      border-radius: 8px;
    }

    code {
      background: #1c2533;
      padding: 2px 4px;
    }
  </style>
</head>
<body>
  <p>Loads the MALDA runtime and the compiled <code>chess.js</code> sample. Compile first:</p>
  <p><code>malda compile Examples/Games/chess.malda --mode js -o Examples/Games/chess.js</code></p>
  <div id="app"></div>

  <script src="../Web/wwwroot/malda-js-runtime.js"></script>
  <script src="./chess.js"></script>
  <script>
    if (window.MaldaApp && typeof window.MaldaApp.main === "function") {
      window.MaldaApp.main();
    }
  </script>
</body>
</html>
