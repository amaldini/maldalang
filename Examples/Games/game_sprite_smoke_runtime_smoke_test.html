<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sprite / camera smoke test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 16px;
      background: #0f141c;
      color: #e7eef7;
    }

    #app canvas {
      width: min(640px, 100%);
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 1px solid #334155;
      border-radius: 8px;
    }

    code {
      background: #1c2533;
      padding: 2px 4px;
    }
  </style>
</head>
<body>
  <p>Loads the MALDA runtime and the compiled <code>game_sprite_smoke.js</code> sample. Compile first:</p>
  <p><code>malda compile Examples/Games/game_sprite_smoke.malda --mode js -o Examples/Games/game_sprite_smoke.js</code></p>
  <div id="app"></div>

  <script src="../Web/wwwroot/malda-js-runtime.js"></script>
  <script src="./game_sprite_smoke.js"></script>
  <script>
    if (window.MaldaApp && typeof window.MaldaApp.main === "function") {
      window.MaldaApp.main();
    }
  </script>
</body>
</html>
