<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mlRuntime.game Pixel Blit Ray Tracer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 16px;
      background: #0f172a;
      color: #e2e8f0;
    }

    #app canvas {
      width: min(960px, 100%);
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 1px solid #334155;
      border-radius: 8px;
    }

    code {
      background: #111827;
      padding: 2px 4px;
    }
  </style>
</head>
<body>
  <h1>mlRuntime.game Pixel Blit Smoke Test</h1>
  <p>Loads the MALDA runtime and the compiled <code>ray_tracer.js</code> sample. Compile first:</p>
  <p><code>malda compile Examples/Web/js/ray_tracer.malda --mode js -o Examples/Web/js/ray_tracer.js</code></p>
  <div id="app"></div>

  <script src="../wwwroot/malda-js-runtime.js"></script>
  <script src="./ray_tracer.js"></script>
  <script>
    if (window.MaldaApp && typeof window.MaldaApp.main === "function") {
      window.MaldaApp.main();
    }
  </script>
</body>
</html>
