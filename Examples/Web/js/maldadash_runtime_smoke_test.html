<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maldadash Smoke Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 16px;
      background: #0b0a08;
      color: #e7e5e4;
    }

    #app canvas {
      width: min(960px, 100%);
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 1px solid #44403c;
      border-radius: 8px;
    }

    code {
      background: #1c1917;
      padding: 2px 4px;
    }
  </style>
</head>
<body>
  <h1>Maldadash</h1>
  <p>Loads the MALDA runtime and the compiled <code>maldadash.js</code> sample. Compile first:</p>
  <p><code>malda compile Examples/Web/js/maldadash.malda --mode js -o Examples/Web/js/maldadash.js</code></p>
  <p>Arrows / WASD to move. Collect the quota of diamonds, then enter the exit. R restarts the cave. P pauses.</p>
  <div id="app"></div>

  <script src="../wwwroot/malda-js-runtime.js"></script>
  <script src="./maldadash.js"></script>
  <script>
    if (window.MaldaApp && typeof window.MaldaApp.main === "function") {
      window.MaldaApp.main();
    }
  </script>
</body>
</html>
