<?xml version="1.0" encoding="UTF-8"?>
<!--
  Bound-edition cover plate for the Italian MALDA Reference Manual.

  Replace this file and rebuild with:
    scripts/build-reference-manual-book.ps1 -Locale it
  Keep title and subtitle in the SVG. Version, date and trim are HTML overlaid
  at the bottom of the page - leave that band dark, or restyle .cover-meta.

  viewBox is 7:10. object-fit: cover crops to A4 / Letter / 6x9; keep live
  content inside x 80-620, y 120-880.

  Copyright (c) 2026 Andrea Maldini
  SPDX-License-Identifier: MIT OR Apache-2.0
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1000" role="img">
  <title>Manuale di riferimento MALDA</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0b181e"/>
      <stop offset="1" stop-color="#101a22"/>
    </linearGradient>
    <linearGradient id="glow" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7c86" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#0e7c86" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="700" height="1000" fill="url(#bg)"/>
  <rect width="700" height="1000" fill="url(#glow)"/>
  <rect x="0" y="0" width="14" height="1000" fill="#0e7c86"/>

  <!-- Agent network: a hub and satellites. Decorative; not a diagram. -->
  <g fill="none" stroke="#0e7c86" stroke-width="1.15" opacity="0.55">
    <line x1="430" y1="210" x2="560" y2="128"/>
    <line x1="430" y1="210" x2="620" y2="250"/>
    <line x1="430" y1="210" x2="520" y2="340"/>
    <line x1="430" y1="210" x2="310" y2="160"/>
    <line x1="560" y1="128" x2="620" y2="250"/>
    <line x1="620" y1="250" x2="520" y2="340"/>
    <line x1="310" y1="160" x2="250" y2="250"/>
    <line x1="250" y1="250" x2="430" y2="210"/>
    <line x1="520" y1="340" x2="390" y2="400"/>
    <line x1="390" y1="400" x2="430" y2="210"/>
  </g>
  <g fill="#0e7c86">
    <circle cx="430" cy="210" r="7.5"/>
    <circle cx="560" cy="128" r="4.5" opacity="0.85"/>
    <circle cx="620" cy="250" r="5" opacity="0.9"/>
    <circle cx="520" cy="340" r="4.2" opacity="0.8"/>
    <circle cx="310" cy="160" r="4" opacity="0.75"/>
    <circle cx="250" cy="250" r="3.6" opacity="0.7"/>
    <circle cx="390" cy="400" r="3.8" opacity="0.7"/>
  </g>
  <circle cx="430" cy="210" r="18" fill="none" stroke="#2aa0aa" stroke-width="1.2" opacity="0.45"/>
  <circle cx="430" cy="210" r="32" fill="none" stroke="#0e7c86" stroke-width="0.8" opacity="0.22"/>

  <g fill="#f4fbfc" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="80" y="528" font-size="86" font-weight="700" letter-spacing="-2.4">MALDA<tspan font-size="22" font-weight="500" letter-spacing="0" dy="-46" dx="6">"</tspan></text>
    <text x="80" y="588" font-size="26" font-weight="500" fill="#c5d4d8" letter-spacing="0.2">Manuale di riferimento</text>
    <rect x="80" y="614" width="72" height="4" fill="#0e7c86"/>
    <text x="80" y="656" font-size="15" font-weight="400" fill="#8aa3a8">Multi Agent Language with Development Automation</text>
    <text x="80" y="678" font-size="15" font-weight="400" fill="#8aa3a8">Il linguaggio di programmazione AI-First</text>
  </g>

  <!-- Dark band under the HTML edition line (bottom ~16 mm on A4). -->
  <rect x="0" y="868" width="700" height="132" fill="#0a1218"/>
</svg>
