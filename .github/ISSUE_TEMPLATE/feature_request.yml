name: Feature request
description: Propose a language, tooling, or documentation improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Open an issue before a large design change. See [CONTRIBUTING.md](https://github.com/amaldini/maldalang/blob/main/CONTRIBUTING.md).

        Product apps and vertical domain packs are out of scope for this repository.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change? Language syntax, built-in, IDE UX, docs, etc.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Language / runtime
        - Compiler / transpile
        - CLI
        - Desktop IDE
        - Web IDE
        - VS Code extension / Language Server
        - Examples / templates
        - Documentation / Reference Manual
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or related issues/PRs.
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Examples, sketches, or links that help evaluate the idea.
    validations:
      required: false
