name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Build OSS distribution (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve and verify release version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(?<ver>\d+\.\d+\.\d+)$') {
            throw "Release tags must be vMAJOR.MINOR.PATCH (got '$tag')."
          }
          $version = $Matches['ver']
          $csproj = Get-Content "MaldaLang/MaldaLang.csproj" -Raw
          if ($csproj -notmatch '<Version>\s*([^<]+?)\s*</Version>') {
            throw "MaldaLang.csproj has no <Version> element."
          }
          $csprojVersion = $Matches[1].Trim()
          if ($csprojVersion -ne $version) {
            throw "Tag v$version does not match MaldaLang.csproj <Version>$csprojVersion. Bump both csproj Version fields before tagging."
          }
          $desktop = Get-Content "MaldaLang.DesktopIDE/MaldaLang.DesktopIDE.csproj" -Raw
          if ($desktop -notmatch '<Version>\s*([^<]+?)\s*</Version>') {
            throw "MaldaLang.DesktopIDE.csproj has no <Version> element."
          }
          $desktopVersion = $Matches[1].Trim()
          if ($desktopVersion -ne $version) {
            throw "Tag v$version does not match DesktopIDE <Version>$desktopVersion."
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Write-Host "Release version $version matches csproj."

      - name: Build distribution zip
        shell: pwsh
        run: ./scripts/build-oss-dist.ps1 -Runtime ${{ matrix.rid }} -Version ${{ steps.ver.outputs.version }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: malda-${{ matrix.rid }}
          path: artifacts/dist/malda-*-${{ matrix.rid }}.zip
          if-no-files-found: error

  publish:
    name: Attach zips to GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
