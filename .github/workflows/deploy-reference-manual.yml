name: Deploy Reference Manual

on:
  push:
    branches: [main, master]
    paths:
      - "ReferenceManual/**"
      - "scripts/rewrite-reference-manual-pages-md-links.py"
      - ".github/workflows/deploy-reference-manual.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish ReferenceManual to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PAGES_REF: ${{ github.event.repository.default_branch }}
        run: |
          mkdir -p _site/it
          # Static HTML/CSS/JS/JSON only — skip authoring helpers.
          find ReferenceManual -maxdepth 1 -type f \
            \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.json' \) \
            -exec cp {} _site/ \;
          find ReferenceManual/it -maxdepth 1 -type f \
            \( -name '*.html' -o -name '*.json' \) \
            -exec cp {} _site/it/ \;
          # Playable GPU billiards appendix (sibling fallbacks in billiards-play.html).
          cp Examples/Web/wwwroot/vendor/three.min.js _site/three.min.js
          cp Examples/Web/wwwroot/malda-js-runtime.js _site/malda-js-runtime.js
          # ../docs/*.md is outside the Pages project root and 404s; point at GitHub.
          python3 scripts/rewrite-reference-manual-pages-md-links.py \
            --site _site \
            --source ReferenceManual \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${PAGES_REF:-main}"
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
