name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build and smoke tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build
        run: dotnet build MaldaLang.sln -c Release --verbosity minimal

      - name: Desktop IDE theme catalog tests
        run: >
          dotnet test MaldaLang.DesktopIDE.Tests -c Release --no-build
          --filter "FullyQualifiedName~ThemeCatalogTests|FullyQualifiedName~PrimaryButtonContrastTests"
          --verbosity minimal

      - name: Smoke tests (filtered)
        run: >
          dotnet test MaldaLang.Tests -c Release --no-build
          --filter "FullyQualifiedName~BuiltInRegistryTests|FullyQualifiedName~CompilerPackDecouplingGuardTests|FullyQualifiedName~OptionalPackTranspileEmitTests|FullyQualifiedName~LicenseHeaderGuardTests|FullyQualifiedName~ReleaseVersionGuardTests|FullyQualifiedName~ReferenceManual|FullyQualifiedName~BackendCapabilityMatrixGuardTests|FullyQualifiedName~TranspileSmokeTests|FullyQualifiedName~InterpretTranspilePairTests|FullyQualifiedName~InterpretJsPairTests"
          --verbosity minimal

  build-linux:
    name: Build and run CLI (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # MaldaLang.sln contains the WPF Desktop IDE (net8.0-windows), which cannot build
      # on Linux. Build the cross-platform projects explicitly instead of the solution.
      - name: Build cross-platform projects
        run: |
          dotnet build MaldaLang -c Release --verbosity minimal
          dotnet build MaldaLang.Compiler -c Release --verbosity minimal
          dotnet build MaldaLang.LanguageServer -c Release --verbosity minimal
          dotnet build MaldaLang.IDE -c Release --verbosity minimal
          dotnet build MaldaLang.Tests -c Release --verbosity minimal

      # Narrower than Windows (no ReferenceManual / Desktop-tied guards). Includes
      # transpile smoke: C# emit is cross-platform and does not require WPF.
      - name: Platform-neutral guard tests
        run: >
          dotnet test MaldaLang.Tests -c Release --no-build
          --filter "FullyQualifiedName~BuiltInRegistryTests|FullyQualifiedName~LicenseHeaderGuardTests|FullyQualifiedName~ReleaseVersionGuardTests|FullyQualifiedName~TranspileSmokeTests|FullyQualifiedName~InterpretTranspilePairTests|FullyQualifiedName~InterpretJsPairTests"
          --verbosity minimal

      - name: Run an example through the CLI
        run: |
          dotnet build MaldaLang -c Release -o artifacts/malda-cli --verbosity minimal
          ./artifacts/malda-cli/malda Examples/Basics/first_look.malda

  build-macos:
    name: Build and run CLI (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Same cross-platform set as Linux (no WPF Desktop IDE).
      - name: Build cross-platform projects
        run: |
          dotnet build MaldaLang -c Release --verbosity minimal
          dotnet build MaldaLang.Compiler -c Release --verbosity minimal
          dotnet build MaldaLang.LanguageServer -c Release --verbosity minimal
          dotnet build MaldaLang.IDE -c Release --verbosity minimal
          dotnet build MaldaLang.Tests -c Release --verbosity minimal

      - name: Platform-neutral guard tests
        run: >
          dotnet test MaldaLang.Tests -c Release --no-build
          --filter "FullyQualifiedName~BuiltInRegistryTests|FullyQualifiedName~LicenseHeaderGuardTests|FullyQualifiedName~ReleaseVersionGuardTests|FullyQualifiedName~TranspileSmokeTests|FullyQualifiedName~InterpretTranspilePairTests|FullyQualifiedName~InterpretJsPairTests"
          --verbosity minimal

      - name: Run an example through the CLI
        run: |
          dotnet build MaldaLang -c Release -o artifacts/malda-cli --verbosity minimal
          ./artifacts/malda-cli/malda Examples/Basics/first_look.malda
